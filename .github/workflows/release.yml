name: Release Obsidian plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact semver tag to release, e.g. 1.9.10"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease for BRAT beta installs"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Tags must be exact semver without v prefix or prerelease suffix, e.g. 1.9.10."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Prepare release assets
        run: npm run release:assets -- ${{ inputs.tag }}

      - name: Prepare release notes
        run: npm run release:notes -- ${{ inputs.tag }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            --title "$RELEASE_TAG"
            --notes-file dist/release/release-notes.md
            dist/release/main.js
            dist/release/manifest.json
            dist/release/styles.css
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
