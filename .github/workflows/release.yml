name: Prepare Obsidian release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing exact semver tag to package (never publishes a release)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected an exact semver tag without a prefix or suffix."
            exit 1
          fi

      - name: Checkout exact candidate tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record candidate commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate, install, check and package exact source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/prepare-release-assets.mjs "$RELEASE_TAG"

      - name: Retain candidate bytes and receipt for explicit BRAT publication
        uses: actions/upload-artifact@v4
        with:
          name: entities-${{ inputs.tag }}-${{ steps.source.outputs.commit }}-${{ github.run_id }}
          path: dist/release/${{ inputs.tag }}/
          if-no-files-found: error
          retention-days: 30
